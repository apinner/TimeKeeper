# TimeKeeper.
#
#   docker compose up -d
#
# then open the app in a browser. There is nothing to configure first: it asks
# you to create an administrator account, and everything else — Active
# Directory, email, leave policy — is set up inside the application.
#
# No .env file is needed. Every value below has a working default; set any of
# them in the environment, or in a .env file next to this one, to override.
#
# APP_BIND controls which interface the port is published on:
#   127.0.0.1  (default) reachable only from the server itself, for a reverse
#              proxy running on that same host
#   0.0.0.0    reachable from anywhere on your network

services:
  app:
    build: .
    image: timekeeper:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timekeeper}:${POSTGRES_PASSWORD:-timekeeper}@postgres:5432/${POSTGRES_DB:-timekeeper}?schema=public
      # Generated on first start and kept in the timekeeper-secret volume when
      # not set here. See docker-entrypoint.sh.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Not required: the sign-in URL is taken from the request. Setting it
      # fixes the address used in email links, which can also be set in
      # Admin → Email.
      AUTH_URL: ${AUTH_URL:-}
      AUTH_TRUST_HOST: "true"
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      TZ: ${TZ:-Europe/London}
    volumes:
      - timekeeper-secret:/app/data
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Deliberately not published: the database is reachable only from the app
    # container, which is why a default password is acceptable here. Set
    # POSTGRES_PASSWORD before the first start if you would rather it were not.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timekeeper}
      POSTGRES_DB: ${POSTGRES_DB:-timekeeper}
      TZ: ${TZ:-Europe/London}
    volumes:
      - timekeeper-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timekeeper} -d ${POSTGRES_DB:-timekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timekeeper-data:
  timekeeper-secret:
