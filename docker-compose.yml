# TimeKeeper — app and database.
#
# No reverse proxy is included: TLS is terminated by your existing
# infrastructure, which should forward to the published port below.
#
# APP_BIND controls which interface the port is published on:
#   127.0.0.1  (default) reachable only from the server itself, for a reverse
#              proxy running on that same host
#   0.0.0.0    reachable from anywhere on your network
#
# AUTH_URL must match the address people actually type.

services:
  app:
    build: .
    image: timekeeper:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timekeeper}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-timekeeper}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env}
      AUTH_TRUST_HOST: "true"
      LDAP_URL: ${LDAP_URL:?set LDAP_URL in .env}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?set LDAP_BASE_DN in .env}
      LDAP_UPN_SUFFIX: ${LDAP_UPN_SUFFIX}
      LDAP_ACCESS_GROUP_DN: ${LDAP_ACCESS_GROUP_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-true}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-10000}
      BOOTSTRAP_ADMIN_UPN: ${BOOTSTRAP_ADMIN_UPN}
      APP_URL: ${APP_URL:-${AUTH_URL}}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-TimeKeeper <timekeeper@example.com>}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      TZ: ${TZ:-Europe/London}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-timekeeper}
      TZ: ${TZ:-Europe/London}
    volumes:
      - timekeeper-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timekeeper} -d ${POSTGRES_DB:-timekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timekeeper-data:
